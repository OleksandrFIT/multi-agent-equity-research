[project]
name = "equity-research"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "ollama>=0.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "pandera>=0.20",
    "yfinance>=0.2.40",
    "pandas-datareader>=0.10",
    "edgartools>=3.0",
    "jsonschema>=4.0",
    "langchain-chroma>=0.1",
    "langchain-ollama>=0.1",
    "langchain-text-splitters>=0.2",
    "chromadb>=0.5",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
rerank = ["sentence-transformers>=3.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["equity_research"]

[tool.pytest.ini_options]
addopts = "-q -m 'not integration'"
markers = ["integration: talks to network/Ollama; skipped by default"]
